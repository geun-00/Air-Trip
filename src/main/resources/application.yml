management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
    endpoint:
      health:
        probes:
          enabled: true                 # /actuator/health/{liveness,readiness} 활성화
        show-details: never             # 프로브 용도면 never 권장(민감정보 차단)
spring:
  profiles:
    default: local
  docker:
    compose:
      lifecycle-management: start_only
  config:
    import: optional:file:.env.local[.properties], classpath:chatbot-prompt.yml
  ai:
    vectorstore:
      mariadb:
        initialize-schema: true
        distance-type: cosine
        dimensions: 1536
        schema-name: trip
        table-name: vectors
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.0
          max-tokens: 1024
      embedding:
        options:
          model: text-embedding-3-small
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: chatbot
      username: ${MONGODB_ROOT_USERNAME}
      password: ${MONGODB_ROOT_PASSWORD}
      authentication-database: admin
    redis:
      repositories:
        enabled: true
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${GMAIL_SMTP_PWD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  datasource:
    url: ${DB_URL}?zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: 50
        generate_statistics: false
        default_batch_fetch_size: 100
    open-in-view: false

  mvc:
    static-path-pattern: /static/**

  flyway:
    baseline-on-migrate: true

  batch:
    job:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          github:
            client-id: ${GH_CLIENT_ID}
            client-secret: ${GH_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-name: airbnb
            redirect-uri: ${BASE_URL}/login/oauth2/code/naver
            provider: naver
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/kakao
            client-name: airbnb
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile_nickname
              - profile_image
              - account_email
            provider: kakao

        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8081

logging:
  level:
    project: debug
    org.springframework.web.filter.CommonsRequestLoggingFilter: debug

decorator:
  datasource:
    p6spy:
      enable-logging: true

tourapi:
  key: ${TOUR_API_KEY}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token:
    expiration: ${JWT_ACCESS_EXP}
  refresh-token:
    expiration: ${JWT_REFRESH_EXP}

cloudflare:
  r2:
    endpoint: https://${R2_ENDPOINT_URL}.r2.cloudflarestorage.com
    public-url: ${R2_PUBLIC_URL}
    bucket: ${R2_BUCKET_NAME}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

rest-day:
  api-key: ${REST_DAY_API_KEY}

payment:
  secret-key: ${PAYMENT_SECRET_KEY}

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: prod
    import: optional:file:.env[.properties], classpath:chatbot-prompt.yml

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000

  jpa:
    show-sql: false
    properties:
      hibernate:
        highlight_sql: false
        generate_statistics: false

  flyway:
    baseline-on-migrate: false

decorator:
  datasource:
    p6spy:
      enable-logging: false

app:
  frontend-url: https://www.jgy914.shop
  base-url: https://airbackend.jgy914.shop

server:
  forward-headers-strategy: native

management:
  prometheus:
    metrics:
      export:
        enabled: true