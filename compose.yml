services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:ActiveProcessorCount=2
        -Dspring.profiles.active=local
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9010
        -Dcom.sun.management.jmxremote.rmi.port=9010
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=localhost
    ports:
      - "8081:8081"
      - "9010:9010"
    mem_limit: 1g
    memswap_limit: 5g
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
        reservations:
          memory: 256m
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - air

  mariadb:
    image: mariadb
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$MARIADB_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - air

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - air

  maria_exporter:
    image: prom/mysqld-exporter
    container_name: sql_exporter
    environment:
      - DATA_SOURCE_NAME=${MARIADB_EXPORTER_USER}:${MARIADB_EXPORTER_PASSWORD}(mariadb:3306)/
    command:
      - "--mysqld.address=mariadb:3306"
      - "--mysqld.username=${MARIADB_EXPORTER_USER}:${MARIADB_EXPORTER_PASSWORD}"
    ports:
      - "9104:9104"
    depends_on:
      - mariadb
    networks:
      - air

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - air

  redis_exporter:
    image: oliver006/redis_exporter
    container_name: redis_exporter
    ports:
      - "9121:9121"
    command:
      - '--redis.addr=redis://redis:6379'
    depends_on:
      - redis
    networks:
      - air

  mail:
    image: maildev/maildev
    container_name: mail
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - air

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=false
      - INFLUXDB_DB=k6
    networks:
      - air

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3003:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./docker-data/grafana:/etc/grafana/provisioning/
    networks:
      - air

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - mariadb
      - redis
    restart: always
    networks:
      - air

networks:
  air:
    driver: bridge

volumes:
  mariadb_data:
  mongo_data:
  redis_data:

name: trip